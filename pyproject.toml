[project]
name = "spotiyutu"
version = "0.1.0"
description = "Merge Spotify metadata + YouTube audio downloader, CLI-first MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "imageio-ffmpeg>=0.7.0",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.3",
    "qrcode>=8.2",
    "rich>=15.0.0",
    "spotipy>=2.26.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
spotiyutu = "spotiyutu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotiyutu"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

